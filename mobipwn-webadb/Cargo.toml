[package]
name = "mobipwn-webadb"
version = "0.1.0"
edition = "2021"
authors = ["IsMyPhonePwned"]
description = "WebUSB ADB client for browser-based bugreport collection (vendored from webadb-rs)"
license = "MIT"

[lib]
name = "webadb_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

web-sys = { version = "0.3.94", optional = true, features = [
    "console",
    "Window",
    "Navigator",
    "Storage",
    "Usb",
    "UsbDevice",
    "UsbConfiguration",
    "UsbInterface",
    "UsbAlternateInterface",
    "UsbEndpoint",
    "UsbInTransferResult",
    "UsbOutTransferResult",
    "UsbControlTransferParameters",
    "UsbDirection",
    "UsbRequestType",
    "UsbRecipient",
    "UsbTransferStatus",
    "UsbDeviceFilter",
    "UsbDeviceRequestOptions",
] }

futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = { version = "0.6", optional = true }
thiserror = "2.0"
rsa = { version = "0.9", features = ["sha1", "pem"] }
sha1 = "0.10"
base64 = "0.22"
getrandom = { version = "0.2.16", features = ["std", "js"] }
log = "0.4"
console_error_panic_hook = { version = "0.1", optional = true }
console_log = { version = "1.0", optional = true }
zip = { version = "0.6", default-features = false, features = ["deflate"], optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-mutable-globals"]

[features]
default = ["webusb"]
webusb = [
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "js-sys",
    "web-sys",
    "serde-wasm-bindgen",
    "console_error_panic_hook",
    "console_log",
    "zip",
]
# Optional bugreport JSON parsers (off by default for smaller wasm).
bugreport-analysis = []
