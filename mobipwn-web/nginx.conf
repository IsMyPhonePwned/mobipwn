map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Match mobipwn-api INGEST_ARCHIVE_BODY_LIMIT (512 MiB); default nginx is 1m.
    client_max_body_size 512m;

    root /usr/share/nginx/html;

    # Same-origin API for the SPA: /api/v1/... → http://mobipwn-api:3000/v1/...
    location /api/ {
        proxy_pass http://mobipwn-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        client_max_body_size 512m;
    }

    # Direct API paths (docs, health probes, OpenAPI) when only the web port is published.
    location = /health {
        proxy_pass http://mobipwn-api:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://mobipwn-api:3000/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /swagger-ui {
        proxy_pass http://mobipwn-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api-docs {
        proxy_pass http://mobipwn-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
