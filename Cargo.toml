[workspace]
resolver = "2"
exclude = ["mobipwn-webadb", "mobi-android-collector"]
members = [
    "mobipwn-core",
    "mobipwn-search",
    "mobipwn-ingest",
    "mobipwn-api",
    "mobipwn-jobs",
    "mobipwn-dac",
    "mobipwn-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["IsMyPhonePwned"]
license = "MIT"
repository = "https://github.com/ismyphonepwned/mobipwn"

[workspace.dependencies]
tokio = { version = "1.48", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
clickhouse = { version = "0.14", features = ["uuid", "chrono", "time", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.19", features = ["v7", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
nom = "7.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
utoipa = { version = "5", features = ["chrono", "uuid", "axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
cron = "0.15"
tokio-cron-scheduler = "0.14"
async-trait = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
clap = { version = "4", features = ["derive", "env"] }

mobipwn-core = { path = "mobipwn-core" }
mobipwn-search = { path = "mobipwn-search" }
mobipwn-ingest = { path = "mobipwn-ingest" }
zip = "2.2"
