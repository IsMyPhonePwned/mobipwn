[package]
name = "ironsift"
version = "0.4.0"
edition = "2021"
description = "IronSift analysis library (mobipwn vendored, platform/server stripped)"
license = "Apache-2.0"

[lib]
name = "ironsift"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.3"
linfa = "0.7"
linfa-clustering = "0.7"
linfa-nn = "0.7"
ndarray = "0.15"
rayon = "1.8"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
log = "0.4"
parking_lot = "0.12"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"
